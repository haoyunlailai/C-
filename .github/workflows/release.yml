name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: pytest -q

      - name: Build exe
        run: pyinstaller "C盘清理助手.spec" --clean --noconfirm

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "小白" "dist/C盘清理助手.exe" --clobber
          gh release delete-asset "小白" "C.exe" --yes || true
