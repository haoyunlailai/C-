name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: pytest -q

      - name: Build exe
        run: pyinstaller "C盘清理助手.spec" --clean --noconfirm

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import config; print(config.APP_VERSION)" | tr -d '\r')
          echo "App version: ${VERSION}"
          ls -l dist/
          gh release delete-asset "小白" "C.exe" --yes || true
          gh release upload "小白" "dist/C盘清理助手.exe" --clobber
          gh release edit "小白" --title "C盘清理助手 v${VERSION}" --notes-file docs/RELEASE_NOTES.md
          gh release view "小白" --json name,assets --jq '{name: .name, assets: [.assets[].name]}'
